version: 3

dotenv: [ '.env.local' ]
env:
  PROJECT_DIR: { sh: pwd }

vars:
  COMPOSE_FILES:
    sh: 'for file in compose.yaml compose.override.yaml; do if [ -f "$file" ]; then printf "%s " "-f" "$(pwd)/$file"; fi; done'

includes:
  env:
    optional: true
    taskfile: ./environment/taskfile/Env.yml
  symfony:
    optional: true
    taskfile: ./environment/taskfile/Symfony.yml
  nextjs:
    optional: true
    taskfile: ./environment/taskfile/NextJS.yml
  app:
    optional: true
    taskfile: ./environment/taskfile/App.yml
  docker:
    optional: true
    taskfile: ./environment/taskfile/Docker.yml
  db:
    optional: true
    taskfile: ./environment/taskfile/Database.yml

tasks:
  project-dir:
    desc: Print project directory
    cmds:
      - echo {{.PROJECT_DIR}}

  missing-configuration:
    internal: true
    preconditions:
      - sh: test -f .env.local
        msg: Missing '.env.local' file. Run 'task env:init' command first.

  php-app-not-exist:
    internal: true
    preconditions:
      - sh: test ! -d {{.PROJECT_DIR}}/{{.PHP_APP_DIR}}
        msg: Symfony project already exist

  php-app-exist:
    internal: true
    preconditions:
      - sh: test -d {{.PROJECT_DIR}}/{{.PHP_APP_DIR}}
        msg: Symfony project not exist

  node-app-not-exist:
    internal: true
    preconditions:
      - sh: test ! -d {{.PROJECT_DIR}}/{{.NODE_APP_DIR}}
        msg: Node app already exist

  node-app-exist:
    internal: true
    preconditions:
      - sh: test -d {{.PROJECT_DIR}}/{{.NODE_APP_DIR}}
        msg: Node app not exist

  dev-only:
    internal: true
    preconditions:
      - sh: '[ $ENV == "dev" ]'
        msg: Task only for "dev" environment!

  prod-only:
    internal: true
    preconditions:
      - sh: '[ $ENV == "prod" ]'
        msg: Task only for "prod" environment!

  secrets-configured:
    internal: true
    preconditions:
      - sh: '! grep -q CHANGE_ME .env.compose'
        msg: "'.env.compose' still contains CHANGE_ME placeholders. Run 'task env:secrets:generate' command first."

  env:update:
    desc: Update environment files
    cmds:
      - git submodule update --remote
      - cp environment/taskfile/Taskfile.yml Taskfile.yml