version: 3

dotenv: [ '.env.local' ]
env:
  PROJECT_DIR: { sh: pwd }

includes:
  env:
    optional: true
    taskfile: ./environment/taskfile/Env.yml
  symfony:
    optional: true
    taskfile: ./environment/taskfile/Symfony.yml
  app:
    optional: true
    taskfile: ./environment/taskfile/App.yml
  docker:
    optional: true
    taskfile: ./environment/taskfile/Docker.yml

tasks:
  project-dir:
    desc: Print project directory
    cmds:
      - echo {{.PROJECT_DIR}}

  missing-configuration:
    internal: true
    preconditions:
      - sh: test -f .env.local
        msg: Missing '.env.local' file. Run 'task env:init' command first.

  php-app-not-exist:
    internal: true
    preconditions:
      - sh: test ! -d {{.PROJECT_DIR}}/{{.PHP_APP_DIR}}
        msg: Symfony project already exist

  php-app-exist:
    internal: true
    preconditions:
      - sh: test -d {{.PROJECT_DIR}}/{{.PHP_APP_DIR}}
        msg: Symfony project not exist

  dev-only:
    internal: true
    preconditions:
      - sh: '[ $ENV == "dev" ]'
        msg: Task only for "dev" environment!

  env:update:
    desc: Update environment files
    cmds:
      - git submodule update --remote
      - cp environment/taskfile/Taskfile.yml Taskfile.yml