version: 3

tasks:
  env:init:
    desc: Setup environment
    cmds:
      - rm -rf .git
      - git init
      - git submodule add -b 1.0 https://github.com/artziom/az-environment.git environment
      - cp environment/.env .env.local
      - cp environment/.gitignore .gitignore
      - cp environment/_README.md README.md
      - cp environment/taskfile/Taskfile.yml Taskfile.yml
      - git add .
      - git commit -m "Initial commit"
      - echo "Next steps"
      - echo "Option 1 => Run 'task docker:compose:init', edit .env and .env.compose files, then run 'task env:build' command for creating specific environment (prod|dev|custom)"
      - echo "Option 2 => Run 'task env:new-project' command for build default dev environment and create new symfony project"