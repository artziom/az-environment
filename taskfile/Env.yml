version: 3

tasks:
  init:
    status:
      - test -f .env.local
    desc: Setup environment
    cmds:
      - date
      - cp environment/.env .env.local
      - echo "Next steps"
      - echo "Option 1 => Edit .env.local, run 'task docker:compose:init', edit .env.compose files, then run 'task env:build' command for creating specific environment (prod|dev|custom)"
      - echo "Option 2 => Run 'task env:new-project' command for build default dev environment and create new symfony project"

  build:
    deps:
      - task: :missing-configuration
    desc: Build docker containers
    cmds:
      - task: :docker:compose:build
      - echo "Next step => Run 'task app:start' command"

  new-project:
    deps:
      - :missing-configuration
      - :php-app-not-exist
    desc: Build docker containers and create a new Symfony and Next.js project
    cmds:
      - task: :docker:compose:init
      - task: build
      - task: :symfony:project:new
      - echo "Next step => Run 'task app:start' command"

  destroy:
    desc: Destroy app. Remove env files, project directories and destroy docker containers. Use only when You want to start from scratch!
    prompt: This is a dangerous command... Do you want to continue?
    deps:
      - :missing-configuration
    cmds:
      - task: :docker:compose:down
      - cp environment/taskfile/_Taskfile.yml Taskfile.yml
      - cp environment/README.md README.md
      - rm -rf {{.PROJECT_DIR}}/{{.PHP_APP_DIR}}
      - rm -f .env.local
      - rm -f .gitignore
      - rm -f .gitmodules
      - rm -f compose.yaml
      - rm -rf .git
      - rm -rf environment