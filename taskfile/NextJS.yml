version: 3

tasks:
    project:new:
        desc: Create a new Next.js project
        internal: true
        deps:
            - :dev-only
            - :node-app-not-exist
        cmds:
            - mkdir {{.PROJECT_DIR}}/{{.NODE_APP_DIR}}
            - docker compose -f {{.PROJECT_DIR}}/compose.yaml -f {{.PROJECT_DIR}}/compose.override.yaml run -v {{.PROJECT_DIR}}:/app -w /app --rm node npx create-next-app@latest
    
    server:start:
        desc: Start Next.js server (dev environment only)
        internal: true
        deps:
            - :dev-only
        cmds:
            - docker compose -f {{.PROJECT_DIR}}/compose.yaml -f {{.PROJECT_DIR}}/compose.override.yaml run -d --rm --service-ports --name nextjs-server node npm run dev
    
    server:stop:
        desc: Stop Next.js server (dev environment only)
        internal: true
        deps:
            - :dev-only
        cmds:
            - docker stop nextjs-server
    
    npm:install:
        desc: Install Next.js dependencies
        internal: true
        deps:
            - :node-app-exist
        cmds:
            - docker compose -f {{.PROJECT_DIR}}/compose.yaml -f {{.PROJECT_DIR}}/compose.override.yaml run --rm node npm install
    
    terminal:
        desc: Run terminal for Next.js project container
        deps:
            - :dev-only
            - :node-app-exist
        cmds:
            - docker compose -f {{.PROJECT_DIR}}/compose.yaml -f {{.PROJECT_DIR}}/compose.override.yaml exec node bash