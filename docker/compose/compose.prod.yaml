name: ${PROJECT_NAME}

include:
  - compose.project.yaml

services:
  php:
    image: ${PROJECT_NAME}-php:prod
    build:
      context: ${PROJECT_DIR}/${PHP_APP_DIR}
      dockerfile: ${PROJECT_DIR}/environment/docker/dockerfile/php/prod/Dockerfile
    env_file:
      - .env.compose
    volumes:
      - jwt_keys:/app/config/jwt
    working_dir: /app

  postgres:
    image: postgres
    env_file:
      - .env.compose
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${PROJECT_DIR}/.data/postgres:/var/lib/postgresql/data

  node:
    image: node
    user: "node"
    env_file:
      - .env.compose
    ports:
      - ${NODE_APP_PORT}:3000
    volumes:
      - ${PROJECT_DIR}/${NODE_APP_DIR}:/app/${NODE_APP_DIR}
    working_dir: /app/${NODE_APP_DIR}

volumes:
  jwt_keys: